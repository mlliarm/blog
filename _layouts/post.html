---
layout: default
---
<article class="post">
  <header>
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  {% if page.gist %}
  <p class="post-source">
    Originally published as a <a href="{{ page.gist }}">gist</a>{% for r in page.related %} · <a href="{{ r.url }}">{{ r.title }}</a>{% endfor %}.
  </p>
  {% endif %}
</article>
<p class="back"><a href="{{ '/' | relative_url }}">← All posts</a></p>
